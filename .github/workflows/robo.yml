name: Robo de promocoes

on:
  schedule:
    - cron: "*/10 * * * *"     # a cada 10 minutos (pode atrasar um pouco)
  workflow_dispatch:            # botao para rodar na hora

permissions:
  contents: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Varredura
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python robo_calcados.py --uma
      - name: Salvar ofertas ja enviadas
        run: |
          git config user.name "robo"
          git config user.email "robo@users.noreply.github.com"
          git add vistos.json || true
          git diff --cached --quiet || (git commit -m "atualiza vistos" && git push)
